<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>VOLTA — spot "Blackout"</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: #070605; color: #fff6e5;
    font-family: var(--font-manrope), system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage * { box-sizing: border-box; }
  .sp-layer { position: absolute; inset: 0; }
  .sp-display { font-family: var(--font-syne), sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: -0.035em; line-height: .92; }
  .sp-mono { font-family: var(--font-jetbrains), monospace; text-transform: uppercase; letter-spacing: .3em; }
  .sp-mask { overflow: hidden; padding-bottom: .08em; margin-bottom: -.08em; }

  /* --- Hook --- */
  #off-text { position: absolute; left: 0; right: 0; top: 940px; text-align: center; font-size: 30px; letter-spacing: .06em; color: rgb(255 246 229 / .4); }
  #switch-wrap { position: absolute; left: 540px; top: 760px; width: 0; height: 0; perspective: 1100px; }
  #switch { position: absolute; left: -150px; top: -230px; width: 300px; height: 460px; transform-style: preserve-3d; }
  #plate {
    position: absolute; inset: 0; border-radius: 40px;
    background: linear-gradient(160deg, #26211b 0%, #15120f 45%, #0c0a08 100%);
    box-shadow: inset 0 1px 0 rgb(255 246 229 / .14), inset 0 -20px 40px rgb(0 0 0 / .6), 0 40px 80px -20px rgb(0 0 0 / .9);
    border: 1px solid rgb(255 246 229 / .1);
  }
  #plate::after { content: ""; position: absolute; inset: 58px 70px; border-radius: 22px; background: #070605; box-shadow: inset 0 6px 18px rgb(0 0 0 / .9), 0 1px 0 rgb(255 246 229 / .08); }
  .screw { position: absolute; left: 50%; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #4a4339, #15120f); }
  #led { position: absolute; left: 50%; bottom: 84px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: #3a2c12; z-index: 2; }
  #lever-pivot { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; z-index: 3; }
  #lever {
    position: absolute; left: -46px; top: -100px; width: 92px; height: 200px; border-radius: 26px;
    background: linear-gradient(180deg, #fff6e5 0%, #e9dfcc 40%, #a99e8b 100%);
    box-shadow: inset 0 2px 0 #fff, inset 0 -10px 18px rgb(0 0 0 / .25), 0 18px 30px -8px rgb(0 0 0 / .8);
    transform-origin: 50% 50%;
  }
  #lever-light { position: absolute; inset: 0; border-radius: 26px; background: radial-gradient(120% 60% at 50% 0%, rgb(255 200 87 / .75), transparent 70%); opacity: 0; }
  #hook-words { position: absolute; left: 70px; top: 1150px; font-size: 150px; }
  #w-accendi { color: #ffc857; }

  /* --- Casa --- */
  #cam { position: absolute; left: 40px; top: 700px; width: 1000px; height: 667px; transform-origin: 566.7px 489px; }
  #cam > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #house-svg-wrap { position: absolute; inset: 0; }
  #house-svg-wrap svg { width: 100%; height: 100%; overflow: visible; }
  #room-words { position: absolute; left: 70px; top: 300px; font-size: 172px; }
  #room-words > div { position: absolute; left: 0; top: 0; white-space: nowrap; }
  #room-caption { position: absolute; left: 74px; top: 500px; font-size: 24px; letter-spacing: .14em; color: rgb(255 246 229 / .62); }

  /* --- Match cut --- */
  #zoom { position: absolute; background: radial-gradient(ellipse at 50% 18%, #fff0c8 0%, #ffc857 42%, #c07a12 100%); opacity: 0; }

  /* --- Telefono --- */
  #phone-halo { position: absolute; left: 540px; top: 990px; width: 1500px; height: 1500px; margin: -750px 0 0 -750px; border-radius: 50%; background: radial-gradient(closest-side, rgb(255 200 87 / .22), rgb(255 200 87 / .05) 55%, transparent); }
  #phone-pos { position: absolute; left: 540px; top: 990px; width: 0; height: 0; perspective: 2200px; }
  #phone { position: absolute; left: -342px; top: -591px; width: 684px; height: 1182px; transform-style: preserve-3d; }
  #phone-body {
    position: absolute; inset: 0; border-radius: 96px;
    background: linear-gradient(135deg, #3a342c 0%, #15120f 30%, #0b0a08 70%, #2c271f 100%);
    box-shadow: 0 0 0 2px #1f1b16, inset 0 0 0 2px rgb(255 246 229 / .16), 0 60px 120px -30px rgb(0 0 0 / .95), 0 0 120px -40px rgb(255 200 87 / .35);
  }
  .phone-btn { position: absolute; width: 6px; border-radius: 3px; background: #2a251f; }
  #screen { position: absolute; left: 22px; top: 22px; width: 640px; height: 1138px; border-radius: 76px; overflow: hidden; background: #0a0908; }
  #screen img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #screen-glow { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 18%, #fff0c8 0%, #ffc857 42%, #c07a12 100%); opacity: 0; }
  #island { position: absolute; left: 50%; top: 26px; width: 190px; height: 54px; margin-left: -95px; border-radius: 30px; background: #000; z-index: 3; }
  #glare { position: absolute; inset: 0; border-radius: 76px; background: linear-gradient(115deg, rgb(255 255 255 / .09) 0%, transparent 28%, transparent 70%, rgb(255 255 255 / .04) 100%); z-index: 4; pointer-events: none; }
  .ripple { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 3px solid rgb(255 246 229 / .85); background: rgb(255 246 229 / .18); opacity: 0; z-index: 5; }
  #site-texts { position: absolute; left: 70px; top: 240px; width: 860px; font-size: 64px; }
  #site-texts > div { position: absolute; left: 0; top: 0; width: 100%; }

  /* --- Desktop --- */
  #desk-pos { position: absolute; left: 540px; top: 960px; width: 0; height: 0; perspective: 2600px; }
  #monitor { position: absolute; left: -500px; top: -330px; width: 1000px; transform-style: preserve-3d; }
  #bezel { position: relative; width: 1000px; height: 640px; border-radius: 28px; background: linear-gradient(160deg, #1d1915, #0b0a08); box-shadow: inset 0 0 0 2px rgb(255 246 229 / .1), 0 50px 100px -30px #000; padding: 26px; }
  #dscreen { position: relative; width: 948px; height: 588px; border-radius: 8px; overflow: hidden; background: #050404; }
  #dscreen img { position: absolute; inset: 0; width: 100%; height: 100%; }
  #neck { margin: 0 auto; width: 150px; height: 110px; background: linear-gradient(90deg, #120f0c, #2a251f 50%, #120f0c); clip-path: polygon(18% 0, 82% 0, 100% 100%, 0 100%); }
  #foot { margin: 0 auto; width: 420px; height: 22px; border-radius: 12px; background: linear-gradient(180deg, #2c271f, #0e0c0a); }
  #desk-text { position: absolute; left: 70px; top: 300px; font-size: 64px; }

  /* --- Finale --- */
  #final-glow { position: absolute; width: 1700px; height: 1700px; margin: -850px 0 0 -850px; border-radius: 50%; background: radial-gradient(closest-side, rgb(255 236 190 / .9) 0%, rgb(255 200 87 / .55) 12%, rgb(255 200 87 / .16) 40%, transparent 72%); }
  #final-logo { position: absolute; left: 110px; top: 497px; width: 800px; color: #fff6e5; }
  #final-logo svg { width: 100%; height: auto; display: block; overflow: visible; }
  #final-title { position: absolute; left: 70px; right: 150px; top: 840px; font-size: 84px; text-align: left; }
  #final-sub { position: absolute; left: 70px; top: 1250px; font-size: 40px; font-weight: 700; color: #ffc857; }
  #final-note { position: absolute; left: 70px; top: 1330px; font-size: 25px; color: rgb(255 246 229 / .55); }

  /* --- Overlay --- */
  #dust { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 65% at 50% 46%, transparent 50%, rgb(0 0 0 / .62) 100%); }
  #flash { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 50%, #fff6e5, #ffe3a3 55%, #ffc857); opacity: 0; mix-blend-mode: screen; }
  #brand { position: absolute; right: 150px; top: 166px; font-size: 25px; letter-spacing: .34em; color: rgb(255 255 255 / .6); opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="world" class="sp-layer">
    <!-- 1. Hook -->
    <div id="hook" class="sp-layer">
      <p id="off-text">Spegni tutto.</p>
      <svg id="hook-wire" class="sp-layer" viewBox="0 0 1080 1920" width="1080" height="1920" fill="none">
        <path id="wire1" d="M540 760 C 700 760, 760 640, 900 640 S 1060 900, 1200 860" stroke="#ffc857" stroke-width="5" stroke-linecap="round" style="filter: drop-shadow(0 0 8px #ffc857) drop-shadow(0 0 22px rgb(255 200 87 / .6))" />
      </svg>
      <div id="switch-wrap">
        <div id="switch">
          <div id="plate"></div>
          <div class="screw" style="top: 22px"></div>
          <div class="screw" style="bottom: 22px"></div>
          <div id="led"></div>
          <div id="lever-pivot"><div id="lever"><div id="lever-light"></div></div></div>
        </div>
      </div>
      <div id="hook-words" class="sp-display">
        <div class="sp-mask"><div id="w-adesso">Adesso</div></div>
        <div class="sp-mask"><div id="w-accendi">accendi.</div></div>
      </div>
    </div>

    <!-- 2. Casa -->
    <div id="house" class="sp-layer">
      <div id="cam">
        <div id="house-svg-wrap"></div>
        <svg id="outline" viewBox="0 0 900 600" fill="none" stroke="#ffc857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 6px #ffc857)">
          <path id="ol-main" d="M-60 520 H90 V220 H60 L350 70 L640 222 H610 V520 H960" />
          <path id="ol-floor" d="M90 360 H610 M230 220 V520 M410 360 V520" stroke-width="2" />
        </svg>
      </div>
      <div id="room-words" class="sp-display"></div>
      <p id="room-caption" class="sp-mono"></p>
    </div>

    <div id="zoom"></div>

    <!-- 3. Telefono con il sito vero -->
    <div id="phone-scene" class="sp-layer">
      <div id="phone-halo"></div>
      <div id="phone-pos">
        <div id="phone">
          <div id="phone-body"></div>
          <div class="phone-btn" style="left: -5px; top: 250px; height: 90px"></div>
          <div class="phone-btn" style="left: -5px; top: 370px; height: 150px"></div>
          <div class="phone-btn" style="right: -5px; top: 330px; height: 190px"></div>
          <div id="screen">
            <img id="screen-img" alt="" />
            <div id="screen-glow"></div>
            <div id="island"></div>
            <div class="ripple" id="rip0"></div><div class="ripple" id="rip1"></div><div class="ripple" id="rip2"></div>
            <div id="glare"></div>
          </div>
        </div>
      </div>
      <div id="site-texts" class="sp-display">
        <div id="st0">Un sito che si accende mentre scorri.</div>
        <div id="st1">Ogni stanza è un servizio.</div>
        <div id="st2">Perfetto sul telefono.</div>
      </div>
    </div>

    <!-- 4. Desktop -->
    <div id="desk-scene" class="sp-layer">
      <div id="desk-text" class="sp-display">Anche su desktop.</div>
      <div id="desk-pos">
        <div id="monitor">
          <div id="bezel"><div id="dscreen"><img id="desk-img" alt="" /></div></div>
          <div id="neck"></div>
          <div id="foot"></div>
        </div>
      </div>
    </div>

    <!-- 5. Finale -->
    <div id="final" class="sp-layer">
      <div id="final-glow"></div>
      <div id="final-logo"></div>
      <div id="final-title" class="sp-display">Vuoi un sito così per la tua attività?</div>
      <p id="final-sub">limitlessmedia.it · scrivici in DM</p>
      <p id="final-note">Progetto concept — VOLTA è un brand inventato</p>
    </div>
  </div>

  <canvas id="dust" width="1080" height="1920"></canvas>
  <div id="vignette"></div>
  <div id="flash"></div>
  <div id="brand" class="sp-mono">LIMITLESS</div>
</div>

<script src="./vendor/gsap.min.js"></script>
<script src="./vendor/SplitText.min.js"></script>
<script src="./vendor/DrawSVGPlugin.min.js"></script>
<script src="./spot.js"></script>
</body>
</html>
